[package]
name = "fr_compute"
version = "0.1.0"
edition = "2021"
description = "Pure compute kernels for futures-research (writes_authority=false)"
license = "MIT"
publish = false

[lib]
name = "fr_compute"
crate-type = ["cdylib", "rlib"]

[features]
default = ["chart-kernel"]
chart-kernel = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
